name: Feature request
description: Propose a new command, flag, check rule, or other improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits this problem, and what do they have to do today without the feature?
      placeholder: "Theme authors can't catch X until deploy time…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the new behaviour look like? Include CLI shape (command/flags/output) or rule semantics if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought of, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - theme-cli (`queek-theme` commands/flags)
        - theme-check (validation rules/library API)
        - create-theme (scaffolder)
        - docs / repo tooling
        - not sure / other
    validations:
      required: true
