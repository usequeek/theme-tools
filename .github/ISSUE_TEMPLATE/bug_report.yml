name: Bug report
description: Something in theme-tools is broken — tell us how to reproduce it.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "`queek theme check` exits 0 on a theme with a missing required file…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What correct behaviour looks like.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Link to a minimal repro repo/gist, or list the exact steps to reproduce.
      placeholder: "1. `npm create @usequeek/theme@latest demo`\n2. delete `theme.json`\n3. run `queek theme check demo`"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Which command?
      description: Which CLI command does this affect?
      options:
        - check
        - dev
        - package
        - init
        - info
        - create-theme (`npm create @usequeek/theme`)
        - theme-check library API (not the CLI)
        - not sure / other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of this command.
      placeholder: |
        $ npx queek theme info
      render: shell
    validations:
      required: true
